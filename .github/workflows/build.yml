name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "**.spec.js"
      - ".idea"
      - ".vscode"
      - ".dockerignore"
      - "Dockerfile"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/build.yml"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --ignore-scripts

      - name: Build Release Files
        if: startsWith(github.ref, 'refs/heads/')
        run: npm run build

      - name: Build and Publish Release Files
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Windows release and assets are published
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = node -p "require('./package.json').version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "PlasmaVu $version" --notes "PlasmaVu $version for Windows. Includes the PlasmaVu dual-preview, FR2/FR3 background gallery, branding, and update improvements." --verify-tag
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "PlasmaVu $version" --notes "PlasmaVu $version for Windows. Includes the PlasmaVu dual-preview, FR2/FR3 background gallery, branding, and update improvements." --draft=false --prerelease=false
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber "release/$version/PlasmaVu-$version-x64.exe" "release/$version/PlasmaVu-$version-x64.exe.blockmap" "release/$version/latest.yml"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release_on_${{ matrix. os }}
          path: release/
          retention-days: 5
